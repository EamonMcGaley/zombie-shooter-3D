<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie Arena</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        overflow: hidden;
      }
      /* As big as the window allows, keeping the 4:3 shape. */
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 4 / 3));
        aspect-ratio: 4 / 3;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* In 3D the top canvas is a see-through HUD; top-down it draws everything. */
      #game {
        cursor: crosshair;
      }
      #stage.top-down #view3d {
        display: none;
      }
      #stage.top-down #game {
        background: #222;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view3d"></canvas>
      <canvas id="game" width="800" height="600"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
